<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salman OSINT Dashboard</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: #00ffcc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-banner {
            border: 2px solid #00ffcc;
            background-color: rgba(0, 255, 204, 0.05);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            width: 90%;
            max-width: 800px;
            margin-bottom: 30px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        .header-banner h2 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffffff;
        }
        .leaderboard {
            width: 90%;
            max-width: 800px;
            background-color: #121318;
            border-radius: 8px;
            border: 1px solid #222530;
            overflow: hidden;
        }
        .item {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px solid #1a1c24;
            font-size: 1.1rem;
        }
        .rank {
            font-weight: bold;
        }
        .rank-1 { color: #ffd700; font-weight: bold; }
        .rank-2 { color: #c0c0c0; }
        .rank-3 { color: #cd7f32; }
        .other-teams { color: #ff4d4d; }
    </style>
</head>
<body>

    <div class="header-banner">
        <h2>تمت إضافة ميزة جدار الحماية والحماية من الهجمات الإلكترونية في الشرق الأوسط بواسطة Salman OSINT 🇸🇦</h2>
    </div>

    <div class="leaderboard">
        <div class="item rank-1">
            <span class="rank">المركز الأول</span>
            <span>Salman Alanzi KSA 🇸🇦</span>
        </div>
        <div class="item rank-2">
            <span class="rank">المركز الثاني</span>
            <span>فريق روسيا هاك</span>
        </div>
        <div class="item rank-3">
            <span class="rank">المركز الثالث</span>
            <span>فريق الأوربيون الأربعة</span>
        </div>
        <div class="item">
            <span class="rank" style="color: #00ffcc;">المركز الخامس</span>
            <span>فريق أشباح الإنترنت</span>
        </div>
        <div class="item other-teams">
            <span class="rank">الفرق الأخرى</span>
            <span>خسارة</span>
        </div>
    </div>

</body>
</html>
